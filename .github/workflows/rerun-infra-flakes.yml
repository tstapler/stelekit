name: Rerun infra flakes

# Re-runs a failed CI run only when every failed job died from runner/network infrastructure
# (lost runner, Bazelisk or apt download failure), never when a test or build step really failed.
# Capped at 2 automatic re-runs so a persistent outage still surfaces as red.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- no checkout, and the only event value used is the numeric run id
    workflows: ["CI", "Bazel CI"]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun failed jobs if all failures are infrastructure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Signatures seen on real runs: setup-bazel's release lookup, a stale apt index, runner teardown.
          infra='Unable to find Bazelisk version|E: Failed to fetch|E: Unable to fetch some archives|The runner has received a shutdown signal|The hosted runner lost communication'

          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name, ([.steps[] | select(.conclusion == "failure")] | length)] | @tsv')
          [ -n "$failed" ] || { echo "no failed jobs"; exit 0; }

          while IFS=$'\t' read -r job_id name failing_steps; do
            # A job that failed with no failing step never finished its steps: the runner was lost.
            if [ "$failing_steps" = "0" ]; then
              echo "infra: $name failed with no failing step"
              continue
            fi
            if gh api "repos/$REPO/actions/jobs/$job_id/logs" 2>/dev/null | grep -qE "$infra"; then
              echo "infra: $name matched a known signature"
              continue
            fi
            echo "real failure: $name - not re-running"
            exit 0
          done <<< "$failed"

          gh run rerun "$RUN_ID" --failed --repo "$REPO"

name: Android Benchmark

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]  # no ready_for_review: `opened` already fires for drafts, so this avoids a pointless duplicate full CI run on every draft->ready flip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  android-benchmark:
    name: Android Instrumented Benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests (capabilities + benchmarks)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_3a
          script: |
            ./gradlew :kmp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.stapler.stelekit.testing.SqliteCapabilityTest --no-daemon
            ./gradlew :kmp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.stapler.stelekit.benchmark.AndroidGraphBenchmark --no-daemon
            adb logcat -d -s ANDROID_BENCH:I > /tmp/android-bench-logcat.txt || true

      - name: Parse results and write summary
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, datetime, re

          logcat_file = "/tmp/android-bench-logcat.txt"
          results = {}
          if os.path.exists(logcat_file):
              for line in open(logcat_file):
                  m = re.search(r'ANDROID_BENCH:\s*(\{.*\})', line)
                  if m:
                      try:
                          obj = json.loads(m.group(1))
                          results[obj.get("metric", "unknown")] = obj
                      except Exception:
                          pass

          load = results.get("loadPhase", {})
          jank = results.get("writeLatency", {})
          saf  = results.get("safIo", {})

          try:
              sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"]).decode().strip()
          except Exception:
              sha = "unknown"
          try:
              branch = subprocess.check_output(["git", "rev-parse", "--abbrev-ref", "HEAD"]).decode().strip()
          except Exception:
              branch = "unknown"

          now = datetime.datetime.now(datetime.timezone.utc)
          summary = {
              "timestamp": now.strftime("%Y-%m-%d %H:%M:%S UTC"),
              "gitSha": sha,
              "branch": branch,
              "phase1Ms": load.get("phase1Ms"),
              "phase3Ms": load.get("phase3Ms"),
              "pageCount": load.get("pageCount"),
              "baselineP95Ms": jank.get("baselineP95Ms"),
              "phase3P95Ms": jank.get("phase3P95Ms"),
              "jankFactor": jank.get("jankFactor"),
              "writes": jank.get("writes"),
              "safDirectMs": saf.get("directMs"),
              "safProviderMs": saf.get("safMs"),
              "safPerFileMs": saf.get("safPerFileMs"),
              "safDirectPerFileMs": saf.get("directPerFileMs"),
              "safOverhead": saf.get("overhead"),
          }

          history_dir = os.path.join("benchmarks", "android-history")
          os.makedirs(history_dir, exist_ok=True)
          slug = now.strftime("%Y-%m-%d_%Hh%Mm%Ss")
          out = os.path.join(history_dir, f"{slug}_{sha}.json")
          with open(out, "w") as f:
              json.dump(summary, f, indent=2)
          print(out)
          with open(os.environ.get("GITHUB_ENV", "/dev/null"), "a") as env:
              env.write(f"ANDROID_BENCH_SUMMARY={out}\n")
          EOF

      - name: Commit benchmark summary (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/android-history/
          git diff --cached --quiet && exit 0
          git commit -m "chore(bench): android benchmark summary ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push attempt $i failed — rebasing and retrying..."
            git pull --rebase origin main
          done

      - name: Select head and baseline summaries
        id: pick
        if: github.event_name == 'pull_request'
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          # Same selection as the old inline script: head = this commit's summary (else newest), base = newest other.
          HEAD_FILE=""; BASE_FILE=""; NEWEST=""
          for f in benchmarks/android-history/*.json; do   # glob sorts by name, i.e. by timestamp
            [ -e "$f" ] || continue
            NEWEST="$f"
            case "$f" in *"$SHA7"*) HEAD_FILE="$f" ;; *) BASE_FILE="$f" ;; esac
          done
          [ -n "$HEAD_FILE" ] || HEAD_FILE="$NEWEST"
          if [ -z "$HEAD_FILE" ]; then echo "No android benchmark summary produced"; exit 0; fi
          node scripts/benchdiff-export.js --kind android --in "$HEAD_FILE" --out bench-head.json
          echo "head_file=$HEAD_FILE" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE_FILE" ]; then
            node scripts/benchdiff-export.js --kind android --in "$BASE_FILE" --out bench-base.json
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare to baseline and post PR comment
        if: github.event_name == 'pull_request' && steps.pick.outputs.head_file != ''
        uses: tstapler/benchdiff@03845d60bd136fe36f365cf8f6ac4a6f9ae86257 # main
        with:
          head: bench-head.json
          base: ${{ steps.pick.outputs.has_base == 'true' && 'bench-base.json' || '' }}
          format: benchdiff
          title: Android Load Benchmark (API 30 x86_64 emulator)
          tag: android-load-benchmark

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-benchmark-results-${{ github.sha }}
          path: |
            /tmp/android-bench-logcat.txt
            benchmarks/android-history/
          retention-days: 30

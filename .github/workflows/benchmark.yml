name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]  # no ready_for_review: `opened` already fires for drafts, so this avoids a pointless duplicate full CI run on every draft->ready flip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Load Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache async-profiler
        id: cache-ap
        uses: actions/cache@v4
        with:
          path: async-profiler-4.4-linux-x64
          key: async-profiler-4.4-linux-x64

      - name: Install tools
        run: |
          if [ "${{ steps.cache-ap.outputs.cache-hit }}" != "true" ]; then
            wget -q -O ap.tar.gz https://github.com/async-profiler/async-profiler/releases/download/v4.4/async-profiler-4.4-linux-x64.tar.gz
            tar xf ap.tar.gz
          fi
          echo "$PWD/async-profiler-4.4-linux-x64/bin" >> $GITHUB_PATH
          sudo apt-get update -qq && sudo apt-get install -y librsvg2-bin

      - name: Run benchmark
        run: |
          ./gradlew :kmp:jvmTestProfile --no-daemon \
            -PapLib="$PWD/async-profiler-4.4-linux-x64/lib/libasyncProfiler.so"

      - name: Generate flamegraph PNGs
        if: always()
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:9}"

          ALLOC_COLLAPSED=kmp/build/reports/graph-load-alloc.collapsed
          if [ -f "$ALLOC_COLLAPSED" ]; then
            ./gradlew -q --no-daemon :tools:flamegraph:run \
              -Pfg.width=1800 \
              "-Pfg.title=Alloc flamegraph (${SHORT_SHA})" \
              -Pfg.colors=mem \
              "-Pfg.input=${ALLOC_COLLAPSED}" \
              -Pfg.output=flamegraph-alloc.svg
            rsvg-convert -w 1800 flamegraph-alloc.svg -o flamegraph-alloc.png
            echo "ALLOC_PNG_GENERATED=true" >> $GITHUB_ENV
          else
            echo "ALLOC_PNG_GENERATED=false" >> $GITHUB_ENV
          fi

          CPU_COLLAPSED=kmp/build/reports/graph-load-cpu.collapsed
          if [ -f "$CPU_COLLAPSED" ]; then
            ./gradlew -q --no-daemon :tools:flamegraph:run \
              -Pfg.width=1800 \
              "-Pfg.title=CPU flamegraph (${SHORT_SHA})" \
              -Pfg.colors=java \
              "-Pfg.input=${CPU_COLLAPSED}" \
              -Pfg.output=flamegraph-cpu.svg
            rsvg-convert -w 1800 flamegraph-cpu.svg -o flamegraph-cpu.png
            echo "CPU_PNG_GENERATED=true" >> $GITHUB_ENV
          else
            echo "CPU_PNG_GENERATED=false" >> $GITHUB_ENV
          fi

      - name: Upload flamegraph PNGs to GitHub
        if: github.event_name == 'pull_request'
        run: |
          upload_png() {
            local file="$1"
            local env_var="$2"
            if [ -f "$file" ]; then
              RESPONSE=$(curl -s \
                -X POST \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                -F "data=@${file}" \
                "https://uploads.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/assets")
              IMAGE_URL=$(echo "$RESPONSE" | jq -r '.url // empty')
              echo "${env_var}=${IMAGE_URL}" >> $GITHUB_ENV
            fi
          }
          upload_png flamegraph-alloc.png FLAMEGRAPH_ALLOC_URL
          upload_png flamegraph-cpu.png FLAMEGRAPH_CPU_URL

      - name: Upload alloc flamegraph
        uses: actions/upload-artifact@v7
        if: always() && env.ALLOC_PNG_GENERATED == 'true'
        with:
          name: flamegraph-alloc-${{ github.sha }}
          path: flamegraph-alloc.png
          archive: false
          retention-days: 30

      - name: Upload CPU flamegraph
        uses: actions/upload-artifact@v7
        if: always() && env.CPU_PNG_GENERATED == 'true'
        with:
          name: flamegraph-cpu-${{ github.sha }}
          path: flamegraph-cpu.png
          archive: false
          retention-days: 30

      - name: Upload profiling data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profiling-data-${{ github.sha }}
          path: |
            kmp/build/reports/graph-load-alloc.collapsed
            kmp/build/reports/graph-load-cpu.collapsed
            kmp/build/reports/flamegraph.html
            kmp/build/reports/benchmark-query-stats.json
            kmp/build/reports/graph-load-wall.jfr
            kmp/build/reports/graph-load.jfr
          retention-days: 30

      - name: Commit benchmark summary (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/history/
          git diff --cached --quiet && exit 0
          git commit -m "chore(bench): benchmark summary ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push attempt $i failed — rebasing and retrying..."
            git pull --rebase origin main
          done

      - name: Select head and baseline summaries
        id: pick
        if: github.event_name == 'pull_request'
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          # Same selection as the old inline script: head = this commit's summary (else newest), base = newest other.
          HEAD_FILE=""; BASE_FILE=""; NEWEST=""
          for f in benchmarks/history/*.json; do   # glob sorts by name, i.e. by timestamp
            [ -e "$f" ] || continue
            NEWEST="$f"
            case "$f" in *"$SHA7"*) HEAD_FILE="$f" ;; *) BASE_FILE="$f" ;; esac
          done
          [ -n "$HEAD_FILE" ] || HEAD_FILE="$NEWEST"
          if [ -z "$HEAD_FILE" ]; then echo "No benchmark summary produced"; exit 0; fi
          node scripts/benchdiff-export.js --kind jvm --in "$HEAD_FILE" --out bench-head.json
          echo "head_file=$HEAD_FILE" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE_FILE" ]; then
            node scripts/benchdiff-export.js --kind jvm --in "$BASE_FILE" --out bench-base.json
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare to baseline and post PR comment
        if: github.event_name == 'pull_request' && steps.pick.outputs.head_file != ''
        uses: tstapler/benchdiff@03845d60bd136fe36f365cf8f6ac4a6f9ae86257 # main
        with:
          head: bench-head.json
          base: ${{ steps.pick.outputs.has_base == 'true' && 'bench-base.json' || '' }}
          format: benchdiff
          title: JVM Load Benchmark (Desktop)
          tag: jvm-load-benchmark

      - name: Post flamegraphs and query stats comment
        if: github.event_name == 'pull_request' && steps.pick.outputs.head_file != ''
        uses: actions/github-script@v7
        env:
          HEAD_FILE: ${{ steps.pick.outputs.head_file }}
        with:
          script: |
            const fs = require('fs');
            const curr = JSON.parse(fs.readFileSync(process.env.HEAD_FILE));

            const allocHotspots = (curr.allocHotspots || []).slice(0, 5)
              .map(h => `\`${h.pct}%\` ${h.frame}`)
              .join('\n');

            const cpuHotspots = (curr.cpuHotspots || []).slice(0, 5)
              .map(h => `\`${h.pct}%\` ${h.frame}`)
              .join('\n');

            const allocUrl = process.env.FLAMEGRAPH_ALLOC_URL || '';
            const cpuUrl = process.env.FLAMEGRAPH_CPU_URL || '';
            const allocSection = allocUrl
              ? `\n![Allocation flamegraph](${allocUrl})\n`
              : '\n_Alloc flamegraph not available_\n';
            const cpuSection = cpuUrl
              ? `\n![CPU flamegraph](${cpuUrl})\n`
              : '\n_CPU flamegraph not available_\n';

            const queryStats = curr.queryStats || [];
            const queryStatsRows = queryStats.slice(0, 15).map(q =>
              `| \`${q.table}:${q.op}\` | ${q.calls} | ${q.p50}ms | ${q.p99}ms | ${q.maxMs}ms | ${q.totalMs}ms |`
            ).join('\n');

            const body = [
              '<!-- stelekit:jvm-load-benchmark-details -->',
              '### JVM Load Benchmark: profiling details',
              '',
              '<details>',
              '<summary>Flamegraphs (this PR)</summary>',
              '',
              '**Allocation** — object allocation pressure (JDBC/SQLite churn)',
              allocSection,
              '**CPU** — method-level hotspots by on-CPU time',
              cpuSection,
              '</details>',
              '',
              queryStats.length > 0 ? '<details>' : '',
              queryStats.length > 0 ? '<summary>Top SQL queries by total time (this PR)</summary>' : '',
              queryStats.length > 0 ? '' : '',
              queryStats.length > 0 ? '| table:operation | calls | p50 | p99 | max | total |' : '',
              queryStats.length > 0 ? '|-----------------|-------|-----|-----|-----|-------|' : '',
              queryStatsRows,
              queryStats.length > 0 ? '' : '',
              queryStats.length > 0 ? '</details>' : '',
              '',
              '<details>',
              '<summary>Top allocation hotspots (this PR)</summary>',
              '',
              allocHotspots || '_No collapsed stacks available_',
              '',
              '</details>',
              '',
              '<details>',
              '<summary>Top CPU hotspots (this PR)</summary>',
              '',
              cpuHotspots || '_No collapsed stacks available_',
              '',
              '</details>',
            ].filter(line => line !== '').join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('<!-- stelekit:jvm-load-benchmark-details -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

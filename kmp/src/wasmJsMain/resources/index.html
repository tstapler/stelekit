<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteleKit — Try in Browser</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1e1e1e">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #1e1e1e; color: #ccc;
            font-family: system-ui, sans-serif; z-index: 10;
            overflow-y: auto;
        }
        #loading.hidden { display: none; }
    </style>
    <!-- Patches COOP/COEP headers for SharedArrayBuffer on hosts that don't set them (e.g. GitHub Pages),
         and caches the app shell for offline use / PWA installability (see stelekit-service-worker.js).
         Skip when the server already provides cross-origin isolation to avoid service-worker cache churn. -->
    <!-- A browser that registered the retired coi-serviceworker.min.js keeps the page cross-origin isolated, so the
         guard below never registers the current worker. Drop that registration and reload once (sessionStorage-guarded). -->
    <script>
    try {
        if (navigator.serviceWorker && !sessionStorage.getItem('staleCoiCleared')) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                var stale = regs.filter(function (r) {
                    var w = r.active || r.waiting || r.installing;
                    return w && /coi-serviceworker\.min\.js$/.test(w.scriptURL);
                });
                if (!stale.length) return;
                sessionStorage.setItem('staleCoiCleared', '1');
                Promise.all(stale.map(function (r) { return r.unregister(); })).then(function () { location.reload(); });
            }).catch(function () {});
        }
    } catch (e) {}
    </script>
    <script>if (!crossOriginIsolated) document.write('<scr' + 'ipt src="stelekit-service-worker.js"><\/scr' + 'ipt>');</script>
</head>
<body>
    <div id="loading">
        <p style="font-size: 18px; margin-bottom: 8px;">Loading SteleKit…</p>
        <p style="font-size: 13px; color: #888; margin-bottom: 4px;">Requires Chrome 119+, Firefox 120+, or Safari 18.2+</p>
        <p style="font-size: 12px; color: #666;">This page may refresh once on first load — this is expected.</p>
    </div>
    <script src="kmp.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var loading = document.getElementById('loading');
                // A boot error (e.g. graph locked by another tab) replaces this overlay's content
                // and must stay visible — ComposeViewport never mounts in that case, so hiding it
                // would leave a blank page instead of the error message.
                if (loading && !window.__stelekit_boot_error) loading.classList.add('hidden');
            }, 8000);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteleKit — Try in Browser</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1e1e1e">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #1e1e1e; color: #ccc;
            font-family: system-ui, sans-serif; z-index: 10;
            overflow-y: auto;
        }
        #loading.hidden { display: none; }
        #loading .bar { width: 16rem; max-width: 80vw; height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin: 12px 0 14px; }
        #loading .bar i { display: block; width: 40%; height: 100%; background: #2f6fd6; border-radius: 2px; animation: stele-slide 1.4s ease-in-out infinite; }
        @keyframes stele-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
        @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; opacity: .5; } }
    </style>
    <!-- Patches COOP/COEP headers for SharedArrayBuffer on hosts that don't set them (e.g. GitHub Pages),
         and caches the app shell for offline use / PWA installability (see stelekit-service-worker.js).
         Skip when the server already provides cross-origin isolation to avoid service-worker cache churn. -->
    <!-- A browser that registered the retired coi-serviceworker.min.js keeps the page cross-origin isolated, so the
         guard below never registers the current worker. Drop that registration and reload once (sessionStorage-guarded). -->
    <script>
    try {
        if (navigator.serviceWorker && !sessionStorage.getItem('staleCoiCleared')) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                var stale = regs.filter(function (r) {
                    var w = r.active || r.waiting || r.installing;
                    return w && /coi-serviceworker\.min\.js$/.test(w.scriptURL);
                });
                if (!stale.length) return;
                sessionStorage.setItem('staleCoiCleared', '1');
                Promise.all(stale.map(function (r) { return r.unregister(); })).then(function () { location.reload(); }).catch(function () {});
            }).catch(function () {});
        }
    } catch (e) {}
    </script>
    <script>if (!crossOriginIsolated) document.write('<scr' + 'ipt src="stelekit-service-worker.js"><\/scr' + 'ipt>');</script>
</head>
<body>
    <div id="loading">
        <p style="font-size: 18px;">Loading SteleKit…</p>
        <div class="bar" role="progressbar" aria-label="Loading SteleKit"><i></i></div>
        <p id="loading-status" aria-live="off" style="font-size: 13px; color: #aaa; margin-bottom: 4px;">Starting…</p>
        <p style="font-size: 12px; color: #666;">Requires Chrome 119+, Firefox 120+, or Safari 18.2+. The page may refresh once on first load.</p>
    </div>
    <script>
        // ?diag: on-screen load diagnostics for slow-download reports. Inert without the query; sends nothing anywhere.
        (function () {
            if (!/[?&]diag(=|&|$)/.test(location.search)) return;
            var t0 = performance.now(), live = {}, maxLag = 0, longTasks = 0, last = performance.now();
            var origFetch = window.fetch;
            window.fetch = function () {
                var p = origFetch.apply(this, arguments);
                var u = String(arguments[0] && arguments[0].url || arguments[0]);
                if (!/\.(wasm|m?js)(\?|$)/.test(u)) return p;
                var rec = live[u] = { start: performance.now(), first: 0, bytes: 0, done: 0, status: 0 };
                return p.then(function (res) {
                    rec.status = res.status;
                    try {
                        var reader = res.clone().body.getReader();
                        (function pump() {
                            reader.read().then(function (r) {
                                if (r.done) { rec.done = performance.now(); return; }
                                if (!rec.first) rec.first = performance.now();
                                rec.bytes += r.value.length;
                                pump();
                            }).catch(function () { rec.done = -1; });
                        })();
                    } catch (e) {}
                    return res;
                }, function (e) { rec.done = -1; throw e; });
            };
            try { new PerformanceObserver(function (l) { longTasks += l.getEntries().length; }).observe({ entryTypes: ['longtask'] }); } catch (e) {}
            setInterval(function () { var n = performance.now(); maxLag = Math.max(maxLag, n - last - 250); last = n; }, 250);
            var box = document.createElement('pre');
            box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;margin:0;padding:8px 10px;z-index:99999;background:rgba(0,0,0,.88);color:#9f9;font:11px/1.35 monospace;white-space:pre-wrap;';
            function name(u) { return u.split('/').pop().slice(0, 28); }
            function render() {
                var c = navigator.connection || {}, nav = performance.getEntriesByType('navigation')[0] || {};
                var L = ['SteleKit load diagnostics (?diag) - screenshot this',
                    't=' + ((performance.now() - t0) / 1000).toFixed(1) + 's  isolated=' + window.crossOriginIsolated + '  sw=' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'controlled' : 'none'),
                    'conn type=' + (c.effectiveType || '?') + ' downlink=' + (c.downlink || '?') + 'Mbps rtt=' + (c.rtt || '?') + 'ms saveData=' + (c.saveData || false) + '  cores=' + (navigator.hardwareConcurrency || '?') + ' mem=' + (navigator.deviceMemory || '?') + 'GB',
                    'main-thread max stall (incl. startup)=' + Math.round(maxLag) + 'ms  longtasks=' + longTasks + '  doc proto=' + (nav.nextHopProtocol || '?'),
                    '-- in-flight/finished (decoded bytes, so larger than the wire size) --'];
                Object.keys(live).forEach(function (u) {
                    var r = live[u], end = r.done > 0 ? r.done : performance.now(), ms = r.first ? end - r.first : 0;
                    L.push(name(u) + ' ' + r.status + ' ' + (r.bytes / 1024).toFixed(0) + 'kB ' + (r.done > 0 ? 'done' : r.done < 0 ? 'FAILED' : 'loading') + ' ttfb=' + (r.first ? Math.round(r.first - r.start) : '-') + 'ms rate=' + (ms ? (r.bytes / 1024 / (ms / 1000)).toFixed(0) : '-') + 'kB/s');
                });
                L.push('-- resource timing (proto, wire kB, ms) --');
                performance.getEntriesByType('resource').filter(function (e) { return e.encodedBodySize > 20000 || e.responseStatus >= 400; }).forEach(function (e) {
                    L.push(name(e.name) + ' ' + (e.nextHopProtocol || '?') + ' ' + (e.transferSize / 1024).toFixed(0) + '/' + (e.encodedBodySize / 1024).toFixed(0) + 'kB ' + Math.round(e.duration) + 'ms st=' + (e.responseStatus || '?') + ' sw=' + (e.workerStart > 0));
                });
                box.textContent = L.join('\n');
            }
            document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box); render(); setInterval(render, 1000); });
        })();
    </script>
    <script src="kmp.js"></script>
    <script>
        // The overlay stays until Compose mounts its canvas (a boot error keeps it too, see BootRefusal.kt);
        // a fixed timeout used to hide it mid-download and leave a blank page on slow connections.
        (function () {
            var loading = document.getElementById('loading');
            var status = document.getElementById('loading-status');
            var t0 = Date.now();
            function say(text) { if (status && !window.__stelekit_boot_error) status.textContent = text; }
            var tick = setInterval(function () {
                if (window.__stelekit_boot_error) { clearInterval(tick); return; }
                var s = Math.round((Date.now() - t0) / 1000);
                var wasm = performance.getEntriesByType('resource').filter(function (e) { return /\.wasm$/.test(e.name); });
                var done = wasm.filter(function (e) { return e.responseEnd > 0; }).length;
                var msg = done ? 'Downloaded ' + done + ' of ~2 app files' : 'Downloading the app (about 8 MB)';
                if (s > 20) msg += ' — slow connection, still going';
                if (s > 90) msg += '. It is cached after this, so later loads are fast';
                say(msg + ' · ' + s + 's');
            }, 1000);
            // Compose attaches its canvas inside document.body's shadow root, so a plain body query never finds it.
            function hasCanvas() { return !!(document.body.shadowRoot && document.body.shadowRoot.querySelector('canvas')); }
            var watch = setInterval(function () {
                if (!hasCanvas()) return;
                clearInterval(watch);
                clearInterval(tick);
                setTimeout(function () { if (loading && !window.__stelekit_boot_error) loading.classList.add('hidden'); }, 300);
            }, 250);
        })();
    </script>
</body>
</html>
